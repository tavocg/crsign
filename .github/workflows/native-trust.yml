name: Native system trust

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install OpenSSL
        run: brew install openssl@3
      - name: Configure
        run: >-
          cmake -S tests/libssig/tests/system_trust -B build-system-trust
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build-system-trust --parallel
      - name: Test
        run: ctest --test-dir build-system-trust --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
      - name: Configure
        run: >-
          cmake -S tests/libssig/tests/system_trust -B build-system-trust -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=/ucrt64
      - name: Build
        run: cmake --build build-system-trust --parallel
      - name: Test
        run: ctest --test-dir build-system-trust --output-on-failure
